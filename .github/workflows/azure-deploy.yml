name: Deploy Node.js to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    
    - name: Install production dependencies
      run: npm ci --omit=dev
    
    - name: Create deployment package
      run: |
        echo "Creating deployment package..."
        mkdir deploy-package
        cp -r . deploy-package/
        cd deploy-package
        rm -rf .git .github node_modules
        npm ci --omit=dev --silent
        ls -la
    
    - name: Create ZIP for deployment
      run: |
        cd deploy-package
        zip -r ../app.zip . -x ".git/*" ".github/*"
        cd ..
        ls -la *.zip
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_46EA752DBDAA45FBA4C9BDD62F6D7D21 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73E9E01567274685AD7D8A55534B7098 }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C15389F600834320848DF9370ACBA4AE }}
    
    - name: Deploy ZIP to Azure Web App
      run: |
        az webapp deploy --resource-group microfinance-rg --name microfinance-backend-api --src-path app.zip --type zip
    
    - name: Set startup command
      run: |
        az webapp config set --resource-group microfinance-rg --name microfinance-backend-api --startup-file "node app.js"